<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Management – QME Manual</title>
<style>
*{box-sizing:border-box}
body{margin:0;height:100vh;height:100dvh;display:flex;font-family:"Segoe UI",Tahoma,Arial,"Malgun Gothic","Myanmar Text","Pyidaungsu","Padauk","Noto Sans Myanmar",sans-serif;color:#1f2a37;background:#ededed52}
#side{width:250px;flex:none;background:#1f2a37;color:#e8edf2;padding:14px;overflow:auto}
#side h1{font-size:17px;margin:0;font-weight:600}
.lf{border-left:3px solid #f0a020;padding-left:10px;margin-bottom:12px}.lf h4{margin:0 0 6px;font-size:14px}.lf textarea{height:80px}
.mi,.li{display:flex;align-items:center;gap:4px}.ord{white-space:nowrap;flex:none}.ord button{padding:0 5px;margin-left:2px;font-size:10px;line-height:16px}
#stage-wrap.pn{cursor:grab}#stage-wrap.dg,#stage-wrap.dg *{cursor:grabbing!important}
#lg{width:100%;margin-bottom:8px}
#hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}#hd button{padding:2px 9px;font-weight:700}
#q{width:100%;padding:6px;margin-bottom:6px;border:0;border-radius:3px;font:inherit;font-size:13px}
.rs,.mi{padding:7px 10px;margin-bottom:3px;border-radius:3px;cursor:pointer;border-left:3px solid transparent;font-size:14px}
.rs{background:#34475c;font-size:12px}.nr{font-size:12px;padding:4px 10px}
.rs:hover,.mi:hover{background:#2c3a4b}.mi.on{background:#2c3a4b;border-left-color:#f0a020}
#res{margin-bottom:8px}
#adm{display:none;margin:12px 0 6px}#adm button,#tg{width:100%;margin-bottom:6px}
#bk{font-size:12px;color:#f0c060;margin-top:8px}
#main{flex:1;overflow:auto;padding:16px}
#bar{margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#bar h2{margin:0 10px 0 0;font-size:18px}
button,select{padding:5px 11px;cursor:pointer;border:1px solid #9aa6b2;background:#fff;border-radius:3px;font:inherit;font-size:13px}
button:hover{background:#e3e8ee}.pri{background:#1f2a37;color:#fff;border-color:#1f2a37}.pri:hover{background:#34475c}.del{color:#b3261e}
#cw{display:flex;gap:16px;align-items:flex-start}
#stage-wrap{flex:1;min-width:0;overflow:auto}
#stage{position:relative;box-shadow:0 1px 4px rgba(0,0,0,.25);background:#fff}
#stage img{display:block;width:100%;-webkit-user-select:none;user-select:none}
.hs{position:absolute;border:2px solid #f0a020;background:rgba(240,160,32,.10);cursor:pointer;-webkit-print-color-adjust:exact}
.hs.po{border:0;background:rgba(240,160,32,.25)}
.hs:hover,.hs.f{background:rgba(240,160,32,.45)}
.n{position:absolute;left:0;top:0;background:#f0a020;color:#1f2a37;font-size:11px;font-weight:700;padding:0 4px;pointer-events:none}
.edit .hs{border-style:dashed;cursor:move}.edit #stage{cursor:crosshair}
.rz{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;background:#1f2a37;border:2px solid #fff;cursor:nwse-resize}
#lst.tp{display:flex;flex-direction:column;overflow:auto;position:sticky;top:0;align-self:flex-start}#lst.tp>*{flex:none}#lst.tp>.tpd{flex:1 1 auto;min-height:60px;overflow:auto;padding-right:4px}.tpa{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#lst{width:600px;flex:none}#lst h4{margin:0 0 6px;font-size:20px}
.li{padding:6px 8px;margin-bottom:3px;background:#fff;border-left:3px solid #f0a020;cursor:pointer;font-size:13px}
.li:hover{background:#fdf0d8}
#tip{position:fixed;display:none;z-index:5;background:#1f2a37;color:#fff;padding:5px 9px;border-radius:3px;font-size:13px;max-width:260px;pointer-events:none}
#ov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(20,28,38,.55);display:none;align-items:center;justify-content:center;z-index:9}
#box{background:#fff;width:780px;max-width:94%;max-height:92vh;overflow:auto;padding:20px;border-top:4px solid #f0a020;border-radius:3px}
#box h3{margin:0 0 10px;font-size:18px}.tx{line-height:1.55;margin-bottom:14px}.tx ul,.tx ol{margin:4px 0;padding-left:22px}
#box a,.tx a{color:#1a5fb4}
.si{max-width:100%;display:block;margin:6px 0 12px}
#box input[type=text],#box textarea{width:100%;padding:7px;margin-bottom:6px;font:inherit;border:1px solid #9aa6b2;border-radius:3px}
#box textarea{height:130px;resize:vertical}
#box label{font-size:13px;font-weight:600;display:block;margin-bottom:3px}
.row{display:flex;gap:6px;justify-content:flex-end;margin-top:10px}
.hint{font-size:12px;color:#5b6978;margin:0 0 8px}
#empty{color:#5b6978;padding:30px 0}
#rs{width:7px;flex:none;cursor:col-resize;background:#c9d1d9}#rs:hover{background:#f0a020}
#side.min{padding:14px 0}#side.min>*{display:none}#side.min>#hd{display:flex;justify-content:center;margin:0}#side.min #hd h1{display:none}
#stage.hid .hs[data-i],#stage.hid .rz{display:none}
.zb{display:flex;gap:4px}.zw.dg{cursor:grabbing}.zw{cursor:grab;overflow:auto;max-height:50vh;border:1px solid #d5dbe2;margin:6px 0 12px;background:#f7f8fa}.zw img{display:block;max-width:none}
.mi,.li{flex-wrap:wrap}.tg{width:20px;flex:none;color:#9fb0c0;font-size:25px;cursor:pointer;text-align:center}
.nb{background:#f0a020;color:#1f2a37;font-size:10px;font-weight:700;padding:0 6px;border-radius:8px;flex:none}
.mw{font-size:11px;color:#f0c060;white-space:nowrap}.li .mw{color:#b26a00}.mi .mw,.li .mw{flex-basis:100%}
.hs.sel2{outline:2px solid #1a5fb4;outline-offset:1px}
.tbr{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}.tbr button{padding:2px 8px}.tbr select{padding:2px 4px;font-size:12px;max-width:150px}
.mi.dt,.li.dt{box-shadow:0 -2px 0 #f0a020}.mi.db,.li.db{box-shadow:0 2px 0 #f0a020}.mi.dm{outline:2px dashed #f0a020;outline-offset:-2px}.mi.drg,.li.drg{opacity:.4}
#pr{display:none}
.hs:focus-visible,.mi:focus-visible,.li:focus-visible,.rs:focus-visible,button:focus-visible{outline:3px solid #1a5fb4;outline-offset:1px}
#box:focus{outline:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}.tab.on{background:#1f2a37;color:#fff;border-color:#1f2a37}
.pv{background:#f7f8fa;border:1px dashed #c9d1d9;padding:6px 8px;font-size:13px;margin:6px 0 0}
.cl{border-left:4px solid #1a5fb4;background:#eaf2fc;padding:6px 10px;margin:6px 0}
.sep{border-top:1px solid #34475c;margin:8px 0}
.tn{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 8px;background:#fff;border:2px solid #1f2a37;border-radius:6px;font-size:13px;line-height:1.25;cursor:pointer;-webkit-user-select:none;user-select:none;overflow:hidden}
.tn.lk{border-color:#f0a020}.tn.sel{box-shadow:0 0 0 3px #1a5fb4}.tn.src{background:#eaf2fc}.edit .tn{cursor:move}
.lgi{border-left:3px solid #f0a020;background:#fff;padding:10px 14px;margin-bottom:10px}
.vb{display:inline-block;background:#1f2a37;color:#fff;font-size:12px;padding:1px 8px;border-radius:10px;margin-right:8px}
@media(max-width:800px){body{flex-direction:column}#side{width:100%!important;max-height:42vh}#rs{display:none}#main{padding:10px}#cw{flex-direction:column}#lst{width:100%}#stage-wrap{width:100%;flex:none}#box{padding:14px}}
@media print{#side,#main,#ov,#tip{display:none!important}body{display:block;height:auto;background:#fff}#pr{display:block}#pr .pi{margin:10px 0;page-break-inside:avoid}}
</style>
</head>

 k.p.splice(bi,0,[x,y])}
function wpr(a,b,P){var A={x:a.x+a.w/2,y:a.y+a.h/2},B={x:b.x+b.w/2,y:b.y+b.h/2},V=[A],pts=P.map(function(q){return{x:q[0],y:q[1]}}).concat([B]),vert=null;
 pts.forEach(function(Q,i){var U=V[V.length-1],last=i==pts.length-1,first=i==0;
  if(U.x!=Q.x&&U.y!=Q.y){var hf;if(last)hf=Math.abs(U.x-B.x)<=b.w/2?1:0;else if(first)hf=Math.abs(Q.x-A.x)<=a.w/2?0:1;else hf=vert?1:0;V.push(hf?{x:Q.x,y:U.y}:{x:U.x,y:Q.y})}
  V.push(Q);vert=V[V.length-1].x==V[V.length-2].x});
 V=V.filter(function(p,i){return!i||p.x!=V[i-1].x||p.y!=V[i-1].y});
 if(V.length>1){var p0=V[0],p1=V[1],q0=V[V.length-1],q1=V[V.length-2];
  if(p0.x!=p1.x){if(Math.abs(p1.x-p0.x)>a.w/2)p0.x+=(p1.x>p0.x?1:-1)*a.w/2}else if(Math.abs(p1.y-p0.y)>a.h/2)p0.y+=(p1.y>p0.y?1:-1)*a.h/2;
  if(q0.x!=q1.x){if(Math.abs(q1.x-q0.x)>b.w/2)q0.x+=(q1.x>q0.x?1:-1)*b.w/2}else if(Math.abs(q1.y-q0.y)>b.h/2)q0.y+=(q1.y>q0.y?1:-1)*b.h/2}
 return'M'+V.map(function(p){return p.x+','+p.y}).join('L')}
